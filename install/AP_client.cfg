# TS2 Redux: Archipelago Edition -- client configuration
#
# Copy this file into your Homefront: The Revolution GAME ROOT -- the folder the game actually
# runs from (where TimeSplitters2.exe / Homefront2_Release.exe launches), NOT the Bin64 folder.
# Then edit the three values below for your Archipelago room.
#
# Lines starting with '#' are comments. Format is key=value, one per line.

# Archipelago server address, as host:port -- exactly what the room page shows. Examples:
#   archipelago.gg:12345          (a room hosted on archipelago.gg)
#   localhost:38281               (a server running on this machine)
#   192.168.1.50:38281            (someone else's server on your network)
#
# Leave the address plain like that and the client works out the connection type on its own: it
# tries an encrypted connection first and falls back to an unencrypted one if the room doesn't
# use encryption. You do not need to know which yours is.
#
# Advanced: putting ws:// or wss:// in front forces that one and disables the automatic fallback.
host=localhost:38281

# Your slot (player) name, exactly as it appears in the generated multiworld.
slot=Player1

# Room password (leave blank if the room has none).
password=
